<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="M5StickC Plus スマートグラス画面カスタマイザー。ウィジェットをドラッグ＆ドロップして、グラスの表示を自由にデザインしよう。">
  <title>SmartGlass Customizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Site Favicon from Emoji -->
  <link rel="icon" href="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/2525f7702_generated_image.png">


  <!-- ===== Main Layout ===== -->
  <div class="main-layout">

    <!-- ===== Sidebar: Widget Palette ===== -->
    <aside class="sidebar">

      <!-- ★ M5Stick接続パネル -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">📡 M5Stick 接続</div>
        <div class="connect-row">
          <input type="text" class="prop-input" id="m5stick-ip" placeholder="例: 192.168.1.42" style="flex:1;">
          <button class="btn btn-connect" id="btn-connect" title="接続テスト">📶</button>
        </div>
        <div class="connect-status" id="connect-status">未接続</div>
        <button class="btn btn-primary btn-send" id="btn-send" title="M5Stickに送信" style="width:100%; margin-top:8px;">
          <span>レイアウトを送信</span>
        </button>
      </div>

      <!-- ウィジェットパレット -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">基本ウィジェット</div>
        <div class="widget-cards-row" id="widget-palette">

          <div class="widget-card" draggable="true" data-widget-type="clock">
            <div class="widget-card-icon clock"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/7a9f4dec8_generated_image.png" alt="時計"></div>
            <div class="widget-card-info">
              <h3>時計</h3>
              <p>現在時刻を表示</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="text">
            <div class="widget-card-icon text"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/9c5919436_generated_image.png" alt="テキスト"></div>
            <div class="widget-card-info">
              <h3>テキスト</h3>
              <p>自由な文字を表示</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="study">
            <div class="widget-card-icon timer"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/088499a92_generated_image.png" alt="勉強タイマー"></div>
            <div class="widget-card-info">
              <h3>勉強タイマー</h3>
              <p>教科別カウントアップ</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="timer">
            <div class="widget-card-icon timer"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/0d0faf8ee_generated_image.png" alt="タイマー"></div>
            <div class="widget-card-info">
              <h3>タイマー</h3>
              <p>カウントダウン表示</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="piechart">
            <div class="widget-card-icon piechart"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/0d0a0820d_generated_image.png" alt="円グラフ"></div>
            <div class="widget-card-info">
              <h3>円グラフ</h3>
              <p>教科別の割合</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="schedule">
            <div class="widget-card-icon schedule"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/0296b541f_generated_image.png" alt="予定"></div>
            <div class="widget-card-info">
              <h3>予定</h3>
              <p>直近の予定まで表示</p>
            </div>
          </div>

          <div class="widget-card" draggable="true" data-widget-type="weather">
            <div class="widget-card-icon weather"><img src="https://media.base44.com/images/public/69f9bbbfb88988e034ccebd4/fc5e9baf5_generated_image.png" alt="天気"></div>
            <div class="widget-card-info">
              <h3>天気</h3>
              <p>現在の天気情報</p>
            </div>
          </div>

        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">💡 使い方</div>
        <p style="font-size:0.75rem; color:var(--text-secondary); line-height:1.6;">
          ①ウィジェットを<strong>ドラッグ＆ドロップ</strong>で配置<br>
          ②プロパティで位置・色・内容を調整<br>
          ③M5StickのIPを入力して<strong>レイアウトを送信</strong>で即反映！
        </p>
      </div>
    </aside>

    <!-- ===== Canvas Area ===== -->
    <main class="canvas-area">
      <div class="m5stick-frame">
        <div class="m5stick-screen" id="m5stick-screen">
          <div class="empty-state" id="empty-state">
            <div class="empty-state-icon">📦</div>
            <div class="empty-state-text">ウィジェットをドラッグ＆ドロップ</div>
          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- ===== Floating Action Buttons (Right Bottom) ===== -->
  <div class="floating-actions" style="position: fixed; bottom: 16px; right: 16px; display: flex; gap: 12px; z-index: 95; align-items: flex-end;">
    <!-- リセットボタン -->
    <button class="btn btn-danger" id="btn-reset" title="すべてリセット" style="border-radius: 50%; width: 44px; height: 44px; padding: 0; display: flex; justify-content: center; align-items: center; box-shadow: var(--shadow-card);">
      <span class="btn-icon" style="margin: 0; font-size: 1.2rem;">🗑️</span>
    </button>
    <!-- プロパティパネルの表示/非表示 -->
    <button class="props-toggle-btn" id="props-toggle-btn" title="プロパティパネル" style="position: static; box-shadow: var(--shadow-card);">⚙️</button>
  </div>

  <!-- ===== Properties Panel ===== -->
  <div class="properties-panel" id="properties-panel">
    <div class="properties-panel-title">
      ⚙️ プロパティ <span class="badge" id="prop-type-badge">-</span>
    </div>
    <div id="properties-content">
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
